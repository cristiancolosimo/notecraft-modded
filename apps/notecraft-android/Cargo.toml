[package]
name = "notecraft-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "NoteCraft for Android: the same window over the same engine, started from a NativeActivity"

# Not `workspace = true`: the workspace forbids unsafe code, and the one thing Android needs
# is `#[unsafe(no_mangle)]` on the entry point.
[lints.rust]
unsafe_code = "allow"
[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Android loads the app as a shared library and calls `android_main`.
[lib]
crate-type = ["cdylib"]

# Only built for Android: eframe's `accesskit` default cannot be combined with the
# NativeActivity, so this app names its own eframe features, and the desktop build and the
# workspace's `--workspace` runs never see them.
[target.'cfg(target_os = "android")'.dependencies]
notecraft-engine = { workspace = true }
notecraft-store = { workspace = true }
notecraft-ui-egui = { workspace = true }
eframe = { version = "0.36", default-features = false, features = ["android-native-activity", "default_fonts", "wgpu"] }
egui = { workspace = true }
log = { workspace = true }
# The window layer (vendor/winit): the keyboard switch lives in its android module.
winit = { version = "0.30", default-features = false, features = ["android-native-activity", "rwh_06"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.21"
# Only to hand libgit2 Android's trusted certificates (its OpenSSL is built from source and cannot read them from the system folder).
git2 = { version = "0.21", default-features = false }
openssl-sys = "0.9"
libgit2-sys = "0.18"
rfd_android = { package = "notecraft-rfd-android-stub", path = "../../vendor/rfd-android-stub" }

# Built with `cargo xtask android` (cargo-apk underneath). The stylus is read through the
# touch force that winit reports for every contact, see crates/ui-egui/src/stylus.rs.
[package.metadata.android]
package = "it.v01.notecraft"
apk_name = "NoteCraft"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
# 34, not 35: from 35 on the system forces edge-to-edge and ignores adjustResize, which put the
# keyboard over the page and the status bar over the ribbon.
target_sdk_version = 34

[package.metadata.android.application]
label = "NoteCraft"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode|density"
window_soft_input_mode = "adjustResize"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Pictures in shared storage: the permission of Android 13 and later, and the older one before it.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

# The app's own file chooser lists the device's files; from Android 11 that is "All files access", which the
# owner gives in the system's settings for the app.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = true
